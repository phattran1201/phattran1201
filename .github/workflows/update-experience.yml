name: Auto Update Experience Years
on:
  schedule:
    - cron: '0 0 1 1 *' # Chạy vào 00:00 ngày 1 tháng 1 hàng năm
  workflow_dispatch: # Cho phép chạy thủ công bất cứ lúc nào

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Calculate and Update Years
        run: |
          # Thiết lập năm bắt đầu (Dựa trên số 8 và 5 bạn đang có vào năm 2026)
          START_YEAR_DEV=2018
          CURRENT_YEAR=$(date +%Y)
          
          # Tính toán số năm
          YEARS_DEV=$((CURRENT_YEAR - START_YEAR_DEV))
          
          # Sử dụng sed để tìm và thay thế nội dung giữa các thẻ
          # Cập nhật số năm Dev
          sed -i "s/\(<!-- EXP_DEV_START -->\).*\(<!-- EXP_DEV_END -->\)/\1$YEARS_DEV\2/" README.md

      - name: Commit and Push changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git commit -am "chore: auto-update years of experience for $CURRENT_YEAR" || exit 0
          git push
